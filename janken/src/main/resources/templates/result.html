<!DOCTYPE html>
<html lang="ja">

<head th:replace="fragments/head :: head">
  <title>じゃんけん結果</title>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100">
  <div class="max-w-2xl mx-auto p-8 bg-white/5 backdrop-blur-md rounded-2xl shadow-lg mt-20">
    <h1 class="text-2xl md:text-3xl font-extrabold mb-4">じゃんけん結果</h1>

    <div class="space-y-2">
      <p class="text-lg">あなたの手：<span th:text="${result.userHand}" class="font-medium"></span></p>
      <p class="text-lg">CPUの手：<span th:text="${result.cpuHand}" class="font-medium"></span></p>
      <p class="text-lg">勝敗：<span th:text="${result.result}" class="font-semibold text-cyan-300"></span></p>
    </div>

    <div class="flex gap-4 mt-6">
      <a href="/janken"
        class="inline-block px-6 py-3 rounded-lg text-white font-semibold bg-gradient-to-r from-primary to-accent shadow-md hover:scale-105 transition-transform">もう一度勝負する</a>
      <a href="/janken/history"
        class="inline-block px-4 py-2 rounded-md text-cyan-300 border border-white/6 hover:bg-white/3">対戦履歴</a>
    </div>
  </div>
</body>

</html>
