<!DOCTYPE html>
<html lang="ja">

<head th:replace="~{fragments/head :: head}">
  <title>Janken</title>
</head>

<body class="min-h-screen bg-slate-900 text-slate-100">
  <div class="max-w-4xl mx-auto p-8 bg-white/5 backdrop-blur-md rounded-2xl shadow-lg mt-12">
    <h1 class="text-2xl md:text-3xl font-extrabold mb-6">じゃんけんゲーム（CPU対戦）</h1>

    <form th:action="@{/janken/result}" action="/janken/result" method="post" class="space-y-4">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <label class="block text-lg">あなたの手を選択してください：</label>
      <div class="flex items-center gap-6">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="userHand" value="グー" required class="accent-primary">
          <span class="px-3 py-1 rounded-md bg-white/6">グー</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="userHand" value="チョキ" class="accent-primary">
          <span class="px-3 py-1 rounded-md bg-white/6">チョキ</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="radio" name="userHand" value="パー" class="accent-primary">
          <span class="px-3 py-1 rounded-md bg-white/6">パー</span>
        </label>
      </div>

      <div>
        <button type="submit"
          class="mt-4 px-6 py-3 rounded-lg text-white font-semibold bg-gradient-to-r from-primary to-accent shadow-md hover:scale-105 transition-transform">勝負！</button>
      </div>
    </form>

    <h2 class="mt-10 text-xl font-semibold">直近5戦の履歴</h2>
    <div th:if="${recentHistory == null or #lists.isEmpty(recentHistory)}" class="mt-4 text-sm text-white/70">履歴はありません。
    </div>

    <div class="mt-4 overflow-x-auto">
      <table th:if="${recentHistory != null and !#lists.isEmpty(recentHistory)}"
        class="w-full text-left divide-y divide-white/6">
        <thead>
          <tr class="text-sm text-white/80">
            <th class="py-2">日時</th>
            <th class="py-2">あなたの手</th>
            <th class="py-2">CPUの手</th>
            <th class="py-2">勝敗</th>
          </tr>
        </thead>
        <tbody class="text-sm">
          <tr th:each="h : ${recentHistory}" class="odd:bg-white/3 even:bg-transparent">
            <td class="py-2" th:text="${#temporals.format(h.playedAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td class="py-2" th:text="${h.userHand}"></td>
            <td class="py-2" th:text="${h.cpuHand}"></td>
            <td class="py-2" th:text="${h.result}"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="mt-6"><a href="/janken/history" class="text-sm text-cyan-300 hover:underline">対戦履歴（すべて）</a></p>

  </div>

</body>

</html>
